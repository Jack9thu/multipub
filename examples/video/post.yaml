    # collection: 编程小课堂   # 加入已有合集（投稿成功后立即加入，不用等审核）
  douyin:
    title: 三分钟讲清楚 Git 分支  # 抖音标题最多 30 字
    # declaration: 内容为个人观点或见解   # 自主声明，文字需与页面一致；不写则不声明
    # collection: 编程小课堂            # 加入已有合集
  xiaohongshu:
    title: 3分钟搞懂Git分支        # 小红书标题最多 20 字
