kind: video
title: 第12期：三分钟讲清楚 Git 分支
body: |
  用三分钟讲清楚 Git 分支是什么、什么时候开、怎么合并。
  示例仓库和命令清单放在评论区置顶。
tags: [编程, Git, 教程]
video: video.mp4
cover: cover.jpg              # 可选：B站/抖音/小红书封面（抖音按宽高自动放横/竖封面）
