ai_generated: false           # 含 AI 生成内容时改成 true
account: main                 # 对应 mpub login <平台> --account main

platforms:
  bilibili:
    tid: 231                  # 必填：分区 id（231=计算机技术），见 docs/platforms/bilibili.md
    copyright: 1              # 1 自制，2 转载（转载必须填 source）
