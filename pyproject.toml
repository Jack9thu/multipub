[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "multipub"
version = "0.1.0"
description = "一条命令把视频 / 图文 / 文章发布到 B站、抖音、小红书、知乎（浏览器自动化 + 平台 Web 接口）"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "patchright==1.58.2",
  "loguru>=0.7.3",
  "httpx>=0.27,<1",
  "pyyaml>=6.0",
  "mistune>=3.0,<4",
  "pillow>=10.0",
  "segno>=1.6",
  "filelock>=3.13",
]

[project.optional-dependencies]
# 终端里打印抖音/小红书登录二维码需要解码二维码图片；不装也能登录（直接看浏览器窗口或 PNG 文件）
terminal-qr = ["opencv-python-headless>=4.9", "numpy>=1.26"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
mpub = "multipub.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/multipub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
